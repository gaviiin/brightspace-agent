[project]
name = "brightspace-agent"
version = "0.1.0"
description = "BrightSpace Agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "tomli-w",
    "sqlalchemy>=2.0",
    "pymupdf>=1.28.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "langchain-anthropic>=1.5.4",
    "langgraph>=1.2.10",
    "sse-starlette>=3.4.8",
    "python-multipart>=0.0.20",
]

[project.scripts]
brightspace-agent = "brightspace_agent.main:cli"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
media = [
    "yt-dlp>=2026.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brightspace_agent"]
